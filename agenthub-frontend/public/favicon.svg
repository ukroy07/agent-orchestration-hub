<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="AgentHub">
  <title>AgentHub</title>
  <!--
    One orchestrator (the pale centre node) coordinating four agents, in the
    same colours the flow canvas, thought stream and terminal logs use:
    researcher cyan, writer amber, critic red, coder violet. The tile is
    filled rather than transparent so the mark holds up against both light
    and dark browser chrome.

    Sized for the 16px case first: four dots plus a centre is the most
    detail that survives at that size, which is why there is no radar sweep,
    no lettering and no gradient here.
  -->
  <rect width="32" height="32" rx="8" fill="#0B0E14"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" fill="none" stroke="#252B3A"/>

  <!-- spokes: read as a graph at large sizes, blur away harmlessly at 16px -->
  <g stroke="#39415A" stroke-width="1.8" stroke-linecap="round">
    <line x1="16" y1="16" x2="16" y2="8"/>
    <line x1="16" y1="16" x2="24" y2="16"/>
    <line x1="16" y1="16" x2="16" y2="24"/>
    <line x1="16" y1="16" x2="8" y2="16"/>
  </g>

  <!-- the four agents -->
  <circle cx="16" cy="8"  r="3.3" fill="#4FD1E8"/>
  <circle cx="24" cy="16" r="3.3" fill="#F0B84D"/>
  <circle cx="16" cy="24" r="3.3" fill="#F0654D"/>
  <circle cx="8"  cy="16" r="3.3" fill="#9D7BF5"/>

  <!-- the hub -->
  <circle cx="16" cy="16" r="4.7" fill="#0B0E14"/>
  <circle cx="16" cy="16" r="4.0" fill="#E8EAF0"/>
</svg>
