<html lang="en">

    <title>AgentHub — AI orchestration cockpit</title>
    <meta name="description" content="Watch specialized AI agents research, write, and review in real time." />

    <!-- SVG first: one file, crisp at every size, and the only one modern
         browsers will fetch. The PNGs are the fallback for browsers that
         ignore SVG favicons; apple-touch-icon is a separate square-cornered
         render because iOS applies its own rounded mask. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="alternate icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0B0E14" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
